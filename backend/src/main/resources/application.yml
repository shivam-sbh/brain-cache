# Config. Values with ${VAR:default} bind from container env vars first, fall back
# to the default for local dev. Spring's relaxed binding maps SPRING_DATASOURCE_PASSWORD
# env => spring.datasource.password automatically — no explicit mapping needed.

spring:
  application:
    name: brain-cache
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/braincache}
    username: ${SPRING_DATASOURCE_USERNAME:braincache}
    password: ${SPRING_DATASOURCE_PASSWORD:braincache}
  jpa:
    hibernate:
      # validate = fail fast if entities don't match schema. We own schema via SQL/flyway later.
      # For now `update` lets Hibernate create tables from entities during early dev.
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  # SMTP for daily review emails. Gmail: use an app password, not your account password.
  # Empty defaults keep the app booting locally without mail configured.
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          # SES/Gmail want auth+STARTTLS; a local Mailpit catcher wants neither.
          # Override per environment via SMTP_AUTH / SMTP_STARTTLS.
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}

# net.devh gRPC server settings.
grpc:
  server:
    port: 9090

# App-specific config namespace (bound to a @ConfigurationProperties bean later).
braincache:
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-min-32-bytes-long}
    ttl-hours: ${JWT_TTL_HOURS:168}   # 7 days
  review:
    # Interval ladder in days. A card climbs one rung per pass, resets to the first on fail.
    # Comma-separated env override binds into the List<Integer> via relaxed binding.
    intervals-days: ${REVIEW_INTERVALS_DAYS:1,2,4,8,16,32,64,128}
    # Spring cron (6 fields: sec min hour dom mon dow). Default: daily 07:00.
    email-cron: ${REVIEW_EMAIL_CRON:0 0 7 * * *}
    # From-address on the daily review email.
    email-from: ${REVIEW_EMAIL_FROM:brain-cache@localhost}
  recommendation:
    # Daily DSA problem recommendation email ("Brain-Cache: Recommendation"). Separate
    # cron from Revision (07:00). Default: daily 08:00.
    cron: ${RECOMMENDATION_CRON:0 0 8 * * *}
    # Directory holding the DSA CSVs (hard.csv/medium.csv/easy.csv) exported once.
    data-dir: ${RECOMMENDATION_DATA_DIR:data/dsa}
    # 7 slots Mon..Sun = how many problems of that difficulty to recommend that weekday.
    # 0 (or a short array) means none of that difficulty that day. Top-unseen picked by
    # NumCompanies (most-asked first). Default: 1 hard every day, no medium/easy.
    hard:   ${RECOMMENDATION_HARD:1,1,1,1,1,1,1}
    medium: ${RECOMMENDATION_MEDIUM:0,0,0,0,0,0,0}
    easy:   ${RECOMMENDATION_EASY:0,0,0,0,0,0,0}
