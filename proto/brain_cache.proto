syntax = "proto3";

package braincache.v1;

// Generated Java lands here. multiple_files keeps one class per message/service.
option java_package = "com.braincache.grpc.proto";
option java_multiple_files = true;

// ── Auth ──────────────────────────────────────────────────────────────
// First vertical slice: register + login. Everything else builds on this.
service AuthService {
  rpc Register(RegisterRequest) returns (AuthResponse);
  rpc Login(LoginRequest) returns (AuthResponse);
  // Guarded: requires a valid JWT in "authorization: Bearer <token>" metadata.
  rpc WhoAmI(WhoAmIRequest) returns (WhoAmIResponse);
}

message WhoAmIRequest {}

message WhoAmIResponse {
  string email = 1;
}

message RegisterRequest {
  string email = 1;
  string password = 2;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message AuthResponse {
  string token = 1;      // signed JWT — client sends it back in metadata
  string email = 2;
}

// ── Cards ─────────────────────────────────────────────────────────────
// Spaced-repetition core. Every RPC guarded: identity comes from the JWT the
// interceptor parked in the gRPC Context (GrpcSecurity.requireUserEmail()).
service CardService {
  rpc CreateCard(CreateCardRequest) returns (Card);
  rpc ListDueCards(ListDueCardsRequest) returns (ListDueCardsResponse);
  rpc ReviewCard(ReviewCardRequest) returns (Card);
}

message Card {
  int64 id = 1;
  string front = 2;          // prompt / question
  string back = 3;           // answer
  int32 interval_index = 4;  // position in the config interval ladder
  string next_review = 5;    // ISO-8601 instant when the card is next due
}

message CreateCardRequest {
  string front = 1;
  string back = 2;
}

message ListDueCardsRequest {}

message ListDueCardsResponse {
  repeated Card cards = 1;   // cards whose next_review <= now, for the caller
}

message ReviewCardRequest {
  int64 card_id = 1;
  bool passed = 2;           // true -> advance ladder; false -> reset to first interval
}
