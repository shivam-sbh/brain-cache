# Phase-1 local stack. For now just Postgres — backend runs from your IDE/mvn
# against it. Later we add backend, envoy, nginx services here for the EC2 deploy.
services:
  postgres:
    image: postgres:15-alpine
    container_name: braincache-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-braincache}
      POSTGRES_USER: ${POSTGRES_USER:-braincache}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-braincache}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-braincache}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Web UI to view/edit Postgres tables. Single tiny container — fine on a t2.micro.
  #
  # SECURITY: bound to 127.0.0.1 only, so it is NOT reachable from the public internet.
  #   - Local:  open http://localhost:8080
  #   - Prod (EC2): DO NOT open port 8080 in the security group. Reach it over an SSH
  #                 tunnel instead:  ssh -L 8080:localhost:8080 ec2-user@<host>
  #                 then browse http://localhost:8080 on your machine.
  # Login screen fields: System=PostgreSQL, Server=postgres, User/Password/DB from .env.
  adminer:
    image: adminer:4
    container_name: braincache-adminer
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    restart: unless-stopped

  # gRPC-Web proxy for the React frontend. Terminates gRPC-Web on :8081 and forwards
  # native gRPC to the backend running on the host (mvn) at :9090.
  envoy:
    image: envoyproxy/envoy:v1.31-latest
    container_name: braincache-envoy
    ports:
      - "8081:8081"
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    # Lets the container resolve host.docker.internal on Linux/EC2 (already works on macOS).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  pgdata:
