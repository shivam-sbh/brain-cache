# Phase-1 local stack. For now just Postgres — backend runs from your IDE/mvn
# against it. Later we add backend, envoy, nginx services here for the EC2 deploy.
services:
  postgres:
    image: postgres:15-alpine
    container_name: braincache-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-braincache}
      POSTGRES_USER: ${POSTGRES_USER:-braincache}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-braincache}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-braincache}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
